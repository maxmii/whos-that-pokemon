  <!-- Black middle band -->
  <rect x="0" y="90" width="200" height="20" fill="#222"/>
  
  <!-- White center circle -->
  <circle cx="100" cy="100" r="30" fill="#F5F5F5" stroke="#222" stroke-width="6"/>
  
  <!-- Inner circle detail -->
  <circle cx="100" cy="100" r="15" fill="none" stroke="#222" stroke-width="4"/>
  
  <!-- Outer black border -->
